  <path d="M824 585h-48" fill="none" stroke="#0f172a" stroke-width="3" marker-end="url(#step)"/>
  <path d="M444 585h-48" fill="none" stroke="#0f172a" stroke-width="3" marker-end="url(#step)"/>
  <rect x="64" y="720" width="1472" height="76" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="88" y="752" font-size="25" font-weight="600" fill="#0f172a">Validated recovery scope: representative PostgreSQL and ClickHouse application/data recovery.</text>
  <text x="88" y="782" font-size="24" font-weight="400" fill="#334155">Evidence is documented and intentionally scoped.</text>
