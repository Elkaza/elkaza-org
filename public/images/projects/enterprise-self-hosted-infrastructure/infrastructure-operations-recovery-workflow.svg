<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Operations, automation and recovery</title>
  <desc id="desc">An eight-step evidence lifecycle: version-controlled desired state; pre-change validation; Ansible-based Linux and Windows configuration and hardening; post-change verification and idempotency checks; monitoring and security visibility; backup and archive integrity checks; representative PostgreSQL and ClickHouse application and data recovery validation; and documented, intentionally scoped operational evidence.</desc>
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif} </style>
    <marker id="app" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="admin" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#08745b"/>
    </marker>
    <marker id="gov" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6d28d9"/>
    </marker>
    <marker id="step" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="64" y="58" font-size="22" font-weight="700" fill="#1d4ed8">03 / OPERATIONS &amp; RECOVERY</text>
  <text x="64" y="112" font-size="42" font-weight="700" fill="#0f172a">Operations, automation and recovery</text>
  <text x="64" y="155" font-size="24" font-weight="400" fill="#475569">From versioned configuration to representative application and data recovery evidence</text>
  <rect x="64" y="220" width="332" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="88" y="260" font-size="23" font-weight="700" fill="#1d4ed8">01</text>
  <text x="88" y="307" font-size="25" font-weight="650" fill="#0f172a">Desired state</text>
  <text x="88" y="352" font-size="23" font-weight="400" fill="#334155">Version-controlled</text>
  <text x="88" y="384" font-size="23" font-weight="400" fill="#334155">configuration in Git</text>
  <rect x="444" y="220" width="332" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="468" y="260" font-size="23" font-weight="700" fill="#1d4ed8">02</text>
  <text x="468" y="307" font-size="25" font-weight="650" fill="#0f172a">Pre-change validation</text>
  <text x="468" y="352" font-size="23" font-weight="400" fill="#334155">Validate the intended</text>
  <text x="468" y="384" font-size="23" font-weight="400" fill="#334155">change before applying</text>
  <rect x="824" y="220" width="332" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="848" y="260" font-size="23" font-weight="700" fill="#1d4ed8">03</text>
  <text x="848" y="307" font-size="25" font-weight="650" fill="#0f172a">Ansible hardening</text>
  <text x="848" y="352" font-size="23" font-weight="400" fill="#334155">Reproducible configuration</text>
  <text x="848" y="384" font-size="23" font-weight="400" fill="#334155">for Linux and Windows</text>
  <rect x="1204" y="220" width="332" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1228" y="260" font-size="23" font-weight="700" fill="#1d4ed8">04</text>
  <text x="1228" y="307" font-size="25" font-weight="650" fill="#0f172a">Post-change verification</text>
  <text x="1228" y="352" font-size="23" font-weight="400" fill="#334155">Idempotency checks</text>
  <text x="1228" y="384" font-size="23" font-weight="400" fill="#334155">Repeated runs stay stable</text>
  <rect x="1204" y="480" width="332" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1228" y="520" font-size="23" font-weight="700" fill="#1d4ed8">05</text>
  <text x="1228" y="567" font-size="25" font-weight="650" fill="#0f172a">Operational visibility</text>
  <text x="1228" y="612" font-size="23" font-weight="400" fill="#334155">Monitoring and</text>
  <text x="1228" y="644" font-size="23" font-weight="400" fill="#334155">security visibility</text>
  <rect x="824" y="480" width="332" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="848" y="520" font-size="23" font-weight="700" fill="#1d4ed8">06</text>
  <text x="848" y="567" font-size="25" font-weight="650" fill="#0f172a">Backup integrity</text>
  <text x="848" y="612" font-size="23" font-weight="400" fill="#334155">Backup / archive</text>
  <text x="848" y="644" font-size="23" font-weight="400" fill="#334155">integrity checks</text>
  <rect x="444" y="480" width="332" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="468" y="520" font-size="23" font-weight="700" fill="#1d4ed8">07</text>
  <text x="468" y="567" font-size="25" font-weight="650" fill="#0f172a">Recovery validation</text>
  <text x="468" y="612" font-size="23" font-weight="400" fill="#334155">Representative application</text>
  <text x="468" y="644" font-size="23" font-weight="400" fill="#334155">and data recovery</text>
  <rect x="64" y="480" width="332" height="210" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="88" y="520" font-size="23" font-weight="700" fill="#1d4ed8">08</text>
  <text x="88" y="567" font-size="25" font-weight="650" fill="#0f172a">Operational evidence</text>
  <text x="88" y="612" font-size="23" font-weight="400" fill="#334155">Documented validation</text>
  <text x="88" y="644" font-size="23" font-weight="400" fill="#334155">and recovery results</text>
