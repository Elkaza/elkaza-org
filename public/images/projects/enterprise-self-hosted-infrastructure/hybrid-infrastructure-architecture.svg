  <rect x="940" y="580" width="320" height="147" rx="16" fill="#ffffff" stroke="#6aa995" stroke-width="2"/>
  <text x="964" y="619" font-size="21" font-weight="700" fill="#08745b">EXTERNAL WINDOWS LAB</text>
  <text x="964" y="662" font-size="26" font-weight="650" fill="#0f172a">Hybrid Windows Lab</text>
  <text x="964" y="698" font-size="24" font-weight="400" fill="#334155">Windows environment</text>
  <rect x="1330" y="390" width="230" height="300" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="3 7"/>
  <text x="1350" y="433" font-size="22" font-weight="700" fill="#6d28d9">OUTBOUND</text>
  <text x="1350" y="464" font-size="22" font-weight="700" fill="#6d28d9">GOVERNANCE</text>
  <text x="1350" y="529" font-size="29" font-weight="650" fill="#0f172a">Azure Arc</text>
  <text x="1350" y="574" font-size="22" font-weight="400" fill="#334155">Supported Linux</text>
  <text x="1350" y="604" font-size="22" font-weight="400" fill="#334155">and Windows</text>
  <text x="1350" y="634" font-size="22" font-weight="400" fill="#334155">systems</text>
  <path d="M1260 415H1295V636H1260" fill="none" stroke="#6d28d9" stroke-width="3" stroke-dasharray="3 7"/>
  <path d="M1295 550H1330" fill="none" stroke="#6d28d9" stroke-width="3" stroke-dasharray="3 7" marker-end="url(#gov)"/>
  <text x="64" y="771" font-size="24" font-weight="400" fill="#475569">Arrows show connection direction; boundary panels distinguish access and hosting roles.</text>
  <path d="M64 818H1536" stroke="#cbd5e1"/>
  <path d="M64 852h52" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#app)"/>
  <text x="132" y="860" font-size="22" font-weight="400" fill="#334155">Public application traffic</text>
  <path d="M570 852h52" fill="none" stroke="#08745b" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#admin)"/>
  <text x="638" y="860" font-size="22" font-weight="400" fill="#334155">Private administration</text>
  <path d="M1080 852h52" fill="none" stroke="#6d28d9" stroke-width="3" stroke-dasharray="3 7" marker-end="url(#gov)"/>
  <text x="1148" y="860" font-size="22" font-weight="400" fill="#334155">Outbound governance</text>
</svg>
