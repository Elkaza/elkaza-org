<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid architecture and trust boundaries</title>
  <desc id="desc">Detailed sanitized architecture with a public edge, encrypted Tailscale transport, restricted proxy-protocol ingress, a Proxmox-hosted Debian Core Docker platform, private management, monitoring, CrowdSec detection, backups, Windows lab, and outbound Azure Arc governance.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9fbff"/><stop offset="1" stop-color="#edf4ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#13294b" flood-opacity=".11"/></filter>
    <marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#1769d2"/></marker>
    <marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#168e50"/></marker>
    <marker id="av" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7040d6"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#102447}.kicker{font-size:18px;font-weight:800;letter-spacing:2px;fill:#1769d2}.h1{font-size:37px;font-weight:800}.sub{font-size:18px;fill:#52647d}.zone{font-size:18px;font-weight:800;letter-spacing:1.3px}.cardTitle{font-size:21px;font-weight:800}.body{font-size:16px;fill:#40536e}.small{font-size:14px;fill:#52647d}.micro{font-size:13px;fill:#52647d}.label{font-size:14px;font-weight:800}.white{fill:#fff}.blue{fill:#1769d2}.green{fill:#168e50}.violet{fill:#7040d6}.orange{fill:#d96810}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#page)"/>
  <text x="56" y="52" class="kicker">ARCHITECTURE &amp; TRUST BOUNDARIES</text>
  <text x="56" y="96" class="h1">Small public surface, private control plane</text>
  <text x="56" y="128" class="sub">Only application traffic crosses the public boundary; administration stays on the private overlay</text>

  <!-- Trust boundary panels -->
  <rect x="42" y="164" width="310" height="540" rx="18" fill="#f6faff" stroke="#5da0ed" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="64" y="195" class="zone blue">PUBLIC ZONE</text>
  <rect x="376" y="164" width="864" height="540" rx="18" fill="#f5fbf7" stroke="#64bd8a" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="398" y="195" class="zone green">PRIVATE RUNTIME · ON-SITE</text>
  <rect x="1264" y="164" width="294" height="540" rx="18" fill="#faf7ff" stroke="#a682ec" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="1286" y="195" class="zone violet">EXTERNAL SERVICES</text>

  <!-- Public -->
  <rect x="70" y="228" width="254" height="98" rx="12" fill="#fff" stroke="#9fc4f7" filter="url(#shadow)"/>
  <text x="92" y="261" class="cardTitle">Internet + DNS</text>
  <text x="92" y="289" class="body">Public website requests</text>
  <rect x="70" y="382" width="254" height="218" rx="12" fill="#fff" stroke="#5da0ed" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="382" width="254" height="44" rx="12" fill="#1769d2"/>
  <path d="M70 410h254v16H70z" fill="#1769d2"/>
  <text x="92" y="411" class="zone white">PUBLIC EDGE VPS</text>
  <text x="92" y="465" class="body">• HTTP(S) relay</text>
  <text x="92" y="493" class="body">• Host firewall</text>
  <text x="92" y="521" class="body">• Tailscale peer</text>
  <text x="92" y="549" class="body">• No application data</text>
  <rect x="92" y="565" width="210" height="24" rx="12" fill="#e7f1ff"/>
  <text x="197" y="582" text-anchor="middle" class="label blue">MINIMAL ATTACK SURFACE</text>
  <path d="M197 326v48" fill="none" stroke="#1769d2" stroke-width="4" marker-end="url(#ab)"/>

  <!-- On-site platform -->
  <rect x="410" y="224" width="798" height="440" rx="14" fill="#fff" stroke="#76c99a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="410" y="224" width="798" height="46" rx="14" fill="#168e50"/>
  <path d="M410 252h798v18H410z" fill="#168e50"/>
  <text x="434" y="255" class="zone white">PROXMOX HOST → DEBIAN CORE → DOCKER COMPOSE</text>

  <rect x="438" y="296" width="252" height="132" rx="11" fill="#f5f9ff" stroke="#a9c8ee"/>
  <text x="458" y="329" class="cardTitle">Restricted ingress</text>
  <text x="458" y="357" class="body">Nginx Proxy Manager</text>
  <text x="458" y="383" class="small">PROXY protocol listeners</text>
  <text x="458" y="405" class="small">VPS-only firewall rules</text>
  <rect x="715" y="296" width="218" height="132" rx="11" fill="#f5f9ff" stroke="#a9c8ee"/>
  <text x="735" y="329" class="cardTitle">Applications</text>
  <text x="735" y="357" class="body">elkaza.at static site</text>
  <text x="735" y="383" class="body">analytics service</text>
  <text x="735" y="405" class="small">private container network</text>
  <rect x="958" y="296" width="222" height="132" rx="11" fill="#fff8ee" stroke="#edb36f"/>
  <text x="978" y="329" class="cardTitle">Host controls</text>
  <text x="978" y="357" class="body">UFW + DOCKER-USER</text>
  <text x="978" y="383" class="small">persistent rule script</text>
  <text x="978" y="405" class="small">default-deny boundary</text>

  <path d="M690 362h17" fill="none" stroke="#1769d2" stroke-width="4" marker-end="url(#ab)"/>

  <rect x="438" y="462" width="232" height="160" rx="11" fill="#f3fbf6" stroke="#87ceaa"/>
  <text x="458" y="495" class="cardTitle">Threat visibility</text>
  <text x="458" y="524" class="body">CrowdSec log ingestion</text>
  <text x="458" y="550" class="small">NPM parser + scenarios</text>
  <text x="458" y="574" class="small">community CAPI signals</text>
  <rect x="458" y="586" width="190" height="23" rx="11" fill="#fff1df"/>
  <text x="553" y="602" text-anchor="middle" class="label orange">DETECTION · NO BOUNCER</text>

  <rect x="694" y="462" width="232" height="160" rx="11" fill="#f3fbf6" stroke="#87ceaa"/>
  <text x="714" y="495" class="cardTitle">Observability</text>
  <text x="714" y="524" class="body">Uptime Kuma</text>
  <text x="714" y="550" class="body">Netdata + Dozzle</text>
  <text x="714" y="576" class="small">service, host and logs</text>

  <rect x="950" y="462" width="230" height="160" rx="11" fill="#f3fbf6" stroke="#87ceaa"/>
  <text x="970" y="495" class="cardTitle">Backup evidence</text>
  <text x="970" y="524" class="body">Restic + checksums</text>
  <text x="970" y="550" class="small">isolated DB restore</text>
  <text x="970" y="576" class="small">representative scope</text>

  <!-- Encrypted transport -->
  <path d="M324 486H402" fill="none" stroke="#1769d2" stroke-width="5" marker-end="url(#ab)"/>
  <rect x="300" y="444" width="134" height="28" rx="14" fill="#e7f1ff"/>
  <text x="367" y="463" text-anchor="middle" class="label blue">TAILSCALE</text>
  <text x="367" y="513" text-anchor="middle" class="micro blue">PROXY protocol</text>
  <text x="367" y="531" text-anchor="middle" class="micro blue">preserves client IP</text>

  <!-- External -->
  <rect x="1290" y="228" width="242" height="152" rx="12" fill="#fff" stroke="#b79aec" filter="url(#shadow)"/>
  <text x="1312" y="260" class="cardTitle">Better Stack</text>
  <text x="1312" y="289" class="body">External website check</text>
  <text x="1312" y="317" class="body">Host heartbeat</text>
  <text x="1312" y="346" class="small">outside-in alerting</text>
  <rect x="1290" y="408" width="242" height="132" rx="12" fill="#fff" stroke="#b79aec" filter="url(#shadow)"/>
  <text x="1312" y="440" class="cardTitle">Azure Arc</text>
  <text x="1312" y="469" class="body">Hybrid inventory</text>
  <text x="1312" y="497" class="body">Resource visibility</text>
  <text x="1312" y="523" class="small">outbound HTTPS only</text>
  <rect x="1290" y="568" width="242" height="96" rx="12" fill="#fff" stroke="#b79aec" filter="url(#shadow)"/>
  <text x="1312" y="600" class="cardTitle">Windows lab</text>
  <text x="1312" y="629" class="body">Private WinRM + Arc</text>

  <path d="M1290 312h-30V150H197v70" fill="none" stroke="#7040d6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#av)"/>
  <rect x="956" y="136" width="214" height="27" rx="13" fill="#f2ebff"/>
  <text x="1063" y="154" text-anchor="middle" class="label violet">PUBLIC WEBSITE CHECK</text>
  <path d="M1208 488h74" fill="none" stroke="#7040d6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#av)"/>
  <text x="1217" y="472" class="micro violet">outbound</text>

  <!-- Private administration lane -->
  <rect x="42" y="742" width="1516" height="110" rx="16" fill="#effaf4" stroke="#43af73" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="70" y="778" class="zone green">PRIVATE ADMINISTRATION OVER TAILSCALE</text>
  <rect x="70" y="794" width="326" height="38" rx="19" fill="#fff" stroke="#80cda3"/>
  <text x="233" y="819" text-anchor="middle" class="label">Admin workstation · Git · Ansible</text>
  <rect x="490" y="794" width="268" height="38" rx="19" fill="#fff" stroke="#80cda3"/>
  <text x="624" y="819" text-anchor="middle" class="label">SSH to Debian Core</text>
  <rect x="852" y="794" width="268" height="38" rx="19" fill="#fff" stroke="#80cda3"/>
  <text x="986" y="819" text-anchor="middle" class="label">WinRM to Windows lab</text>
  <rect x="1214" y="794" width="300" height="38" rx="19" fill="#fff" stroke="#80cda3"/>
  <text x="1364" y="819" text-anchor="middle" class="label">No Internet-facing admin port</text>
  <path d="M624 794V672" fill="none" stroke="#168e50" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ag)"/>
  <path d="M986 794H1250V635h32" fill="none" stroke="#168e50" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ag)"/>

  <text x="800" y="884" text-anchor="middle" class="small">Sanitized portfolio diagram · addresses, credentials and exploitable routing detail intentionally omitted</text>
</svg>
