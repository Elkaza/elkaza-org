  <text x="64" y="234" font-size="22" font-weight="700" fill="#1d4ed8">PUBLIC BOUNDARY</text>
  <rect x="64" y="254" width="230" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="88" y="303" font-size="28" font-weight="650" fill="#0f172a">Internet</text>
  <rect x="390" y="254" width="306" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="414" y="303" font-size="28" font-weight="650" fill="#0f172a">Public Edge</text>
  <path d="M294 293H390" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#app)"/>
  <path d="M696 293H940" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#app)"/>
  <text x="752" y="252" font-size="22" font-weight="400" fill="#1d4ed8">Approved</text>
  <text x="752" y="279" font-size="22" font-weight="400" fill="#1d4ed8">application path</text>
  <rect x="940" y="200" width="320" height="280" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="964" y="242" font-size="22" font-weight="700" fill="#1d4ed8">ON-SITE COMPUTE</text>
  <text x="964" y="291" font-size="28" font-weight="650" fill="#0f172a">On-site Platform</text>
  <text x="964" y="328" font-size="24" font-weight="400" fill="#334155">Linux environment</text>
  <text x="964" y="421" font-size="24" font-weight="400" fill="#08745b">Private administration</text>
  <rect x="40" y="390" width="740" height="300" rx="16" fill="#ecfdf5" stroke="#6aa995" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="64" y="432" font-size="22" font-weight="700" fill="#08745b">PRIVATE ADMINISTRATION PLANE</text>
  <rect x="64" y="465" width="355" height="184" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="88" y="508" font-size="28" font-weight="650" fill="#0f172a">Administration</text>
  <text x="88" y="541" font-size="28" font-weight="650" fill="#0f172a">Controller</text>
  <text x="88" y="582" font-size="24" font-weight="400" fill="#334155">Git + Ansible</text>
  <text x="88" y="615" font-size="24" font-weight="400" fill="#334155">Reproducible hardening</text>
