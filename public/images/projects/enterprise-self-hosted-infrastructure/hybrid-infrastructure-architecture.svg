<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Architecture and trust boundaries</title>
  <desc id="desc">Public traffic flows from the Internet through Public Edge to the approved application path on the on-site Linux platform. Within the private administration plane, the Administration Controller connects through Tailscale to managed Linux and Windows environments. Both supported environments initiate outbound governance connections to Azure Arc. Line styles distinguish application traffic, private administration and governance.</desc>
  <defs>
    <style>text{font-family:Arial,Helvetica,sans-serif} </style>
    <marker id="app" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="admin" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#08745b"/>
    </marker>
    <marker id="gov" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#6d28d9"/>
    </marker>
    <marker id="step" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0f172a"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="64" y="58" font-size="22" font-weight="700" fill="#1d4ed8">02 / ARCHITECTURE</text>
  <text x="64" y="112" font-size="42" font-weight="700" fill="#0f172a">Architecture and trust boundaries</text>
  <text x="64" y="155" font-size="24" font-weight="400" fill="#475569">Three distinct paths: application traffic, private administration and outbound governance</text>
