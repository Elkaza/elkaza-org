<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Hybrid infrastructure at a glance</title>
  <desc id="desc">Public Edge provides an approved application path to the On-site Platform. The Administration Controller uses Tailscale for private administration of the on-site Linux platform and Hybrid Windows Lab. Git and Ansible support reproducible hardening. Supported Linux and Windows systems connect outbound to Azure Arc. Monitoring, security visibility, backup integrity and representative application and data recovery validation are cross-environment operational capabilities.</desc>
