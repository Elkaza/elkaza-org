<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Hardened Hybrid-Cloud Private Network</title>
  <desc id="desc">Zero-trust private network diagram showing roaming devices, Tailscale private overlay, cloud VPS node, home lab runtime, and planned segmentation.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5.5 L1 10 Z" fill="#0f63d8" /></marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5.5 L1 10 Z" fill="#15803d" /></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" /></filter>
    <style>
      .page{fill:#fff}.title{font:800 54px Arial,sans-serif;fill:#07143a}.zone{fill:#fff;stroke:#9fb0c7;stroke-width:1.8;stroke-dasharray:8 8}.zone-title{font:800 24px Arial,sans-serif;fill:#061b5b}.card{fill:#fff;stroke:#9aaac1;stroke-width:1.6;filter:url(#shadow)}.box{fill:#f8fbff;stroke:#9aaac1;stroke-width:1.4}.muted{fill:#f7f8fa;stroke:#a7aeb9;stroke-width:1.4}.red{fill:#fff;stroke:#ef4444;stroke-width:2}.label{font:800 23px Arial,sans-serif;fill:#07143a}.sub{font:700 15px Arial,sans-serif;fill:#111827}.small{font:700 13px Arial,sans-serif;fill:#111827}.mutedText{font:800 22px Arial,sans-serif;fill:#6b7280}.blue{fill:none;stroke:#0f63d8;stroke-width:4;marker-end:url(#arrow-blue)}.green{fill:none;stroke:#15803d;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow-green)}.redline{fill:none;stroke:#dc2626;stroke-width:3;stroke-dasharray:8 7}.legend{font:700 17px Arial,sans-serif;fill:#07143a}.icon{font:800 32px Arial,sans-serif;fill:#0f63d8}.redText{font:800 15px Arial,sans-serif;fill:#dc2626}.greenText{font:800 16px Arial,sans-serif;fill:#15803d}
    </style>
  </defs>
  <rect class="page" width="1800" height="980" />
  <text x="900" y="64" text-anchor="middle" class="title">Hardened Hybrid-Cloud Private Network</text>

  <rect x="28" y="322" width="126" height="260" rx="12" class="red" />
  <text x="91" y="372" text-anchor="middle" class="label">Public</text><text x="91" y="402" text-anchor="middle" class="label">Internet</text>
  <text x="91" y="472" text-anchor="middle" class="icon" fill="#dc2626">WWW</text>
  <text x="91" y="532" text-anchor="middle" class="redText">No direct access</text><text x="91" y="555" text-anchor="middle" class="redText">to management</text><text x="91" y="578" text-anchor="middle" class="redText">services</text>
  <path class="redline" d="M154 464 H190" /><text x="204" y="478" text-anchor="middle" font-size="42" font-family="Arial" font-weight="800" fill="#dc2626">X</text>

  <rect x="180" y="96" width="260" height="704" rx="16" class="zone" />
  <text x="218" y="141" class="zone-title">1. Roaming Devices</text>
  <rect x="206" y="160" width="184" height="146" rx="10" class="card" /><text x="298" y="232" text-anchor="middle" class="icon">LAP</text><text x="298" y="282" text-anchor="middle" class="label">Laptop</text>
  <rect x="206" y="338" width="184" height="146" rx="10" class="card" /><text x="298" y="410" text-anchor="middle" class="icon">MOB</text><text x="298" y="455" text-anchor="middle" class="label">Mobile admin</text><text x="298" y="483" text-anchor="middle" class="label">device</text>
  <rect x="206" y="516" width="184" height="136" rx="10" class="card" /><text x="298" y="575" text-anchor="middle" class="icon">WIFI</text><text x="298" y="618" text-anchor="middle" class="label">Untrusted Wi-Fi /</text><text x="298" y="646" text-anchor="middle" class="label">travel networks</text>
  <rect x="194" y="678" width="208" height="76" rx="8" class="box" /><text x="298" y="708" text-anchor="middle" class="sub">No public</text><text x="298" y="731" text-anchor="middle" class="sub">management ports</text>

  <rect x="462" y="96" width="340" height="834" rx="16" class="zone" />
  <text x="492" y="141" class="zone-title">2. Tailscale Private Overlay</text>
  <rect x="506" y="202" width="256" height="450" rx="14" class="card" />
  <text x="634" y="342" text-anchor="middle" class="label">Tailscale</text><text x="634" y="374" text-anchor="middle" class="label" fill="#0f63d8">Private Overlay</text>
  <path d="M532 390 H736" stroke="#9aaac1" stroke-width="1.5" />
  <text x="634" y="446" text-anchor="middle" class="label">Encrypted</text><text x="634" y="476" text-anchor="middle" class="label">WireGuard mesh</text>
  <text x="634" y="536" text-anchor="middle" class="label">Stable</text><text x="634" y="566" text-anchor="middle" class="label">private IPs</text>
  <text x="634" y="626" text-anchor="middle" class="label">Authenticated</text><text x="634" y="656" text-anchor="middle" class="label">nodes</text>

  <rect x="818" y="96" width="300" height="834" rx="16" class="zone" />
  <text x="864" y="141" class="zone-title">3. Cloud Node</text>
  <rect x="836" y="180" width="250" height="380" rx="14" class="card" />
  <text x="961" y="246" text-anchor="middle" class="label" font-size="34">VPS</text>
  <rect x="852" y="278" width="218" height="78" rx="8" class="box" /><text x="961" y="326" text-anchor="middle" class="sub">SSH hardened</text>
  <rect x="852" y="375" width="218" height="78" rx="8" class="box" /><text x="961" y="410" text-anchor="middle" class="sub">Private overlay</text><text x="961" y="433" text-anchor="middle" class="sub">node</text>
  <rect x="852" y="472" width="218" height="78" rx="8" class="box" /><text x="961" y="506" text-anchor="middle" class="sub">Key-only SSH</text><text x="961" y="529" text-anchor="middle" class="sub">(ED25519)</text>
  <rect x="846" y="646" width="210" height="52" rx="8" fill="#fff" stroke="#15803d" stroke-width="1.5" /><text x="951" y="680" text-anchor="middle" class="greenText">ED25519 key-only SSH</text>

  <rect x="1138" y="96" width="430" height="834" rx="16" class="zone" />
  <text x="1200" y="141" class="zone-title">4. Home Lab Runtime</text>
  <rect x="1160" y="168" width="374" height="704" rx="16" class="card" />
  <text x="1347" y="222" text-anchor="middle" class="label">Proxmox host</text>
  <rect x="1178" y="248" width="338" height="400" rx="14" fill="#f8fbff" stroke="#0f63d8" stroke-width="1.7" />
  <text x="1347" y="296" text-anchor="middle" class="label">Debian security VM</text>
  <rect x="1200" y="330" width="140" height="105" rx="9" class="box" /><text x="1270" y="389" text-anchor="middle" class="sub">Pi-hole</text>
  <rect x="1360" y="330" width="140" height="105" rx="9" class="box" /><text x="1430" y="377" text-anchor="middle" class="sub">Unbound</text><text x="1430" y="400" text-anchor="middle" class="small">recursive DNS</text>
  <rect x="1200" y="466" width="140" height="105" rx="9" class="box" /><text x="1270" y="518" text-anchor="middle" class="sub">UFW</text><text x="1270" y="541" text-anchor="middle" class="small">firewall</text>
  <rect x="1360" y="466" width="140" height="105" rx="9" class="box" /><text x="1430" y="518" text-anchor="middle" class="sub">Exit node</text><text x="1430" y="541" text-anchor="middle" class="small">routing</text>
  <rect x="1200" y="586" width="300" height="62" rx="8" class="box" /><text x="1350" y="613" text-anchor="middle" class="sub">Host monitoring</text><text x="1350" y="637" text-anchor="middle" class="small">btop</text>
  <rect x="1180" y="670" width="334" height="58" rx="8" class="box" /><text x="1347" y="706" text-anchor="middle" class="sub" fill="#0f63d8">Private DNS</text>
  <rect x="1180" y="744" width="334" height="58" rx="8" class="box" /><text x="1347" y="780" text-anchor="middle" class="sub" fill="#0f63d8">Interface-aware firewall rules</text>
  <rect x="1180" y="818" width="334" height="58" rx="8" class="box" /><text x="1347" y="854" text-anchor="middle" class="sub" fill="#0f63d8">No broad public management exposure</text>

  <rect x="1586" y="96" width="190" height="834" rx="16" class="zone" />
  <text x="1624" y="136" class="zone-title">5. Planned</text><text x="1610" y="168" class="zone-title">Segmentation</text>
  <rect x="1608" y="210" width="144" height="180" rx="10" class="muted" /><text x="1680" y="324" text-anchor="middle" class="mutedText">IoT VLAN</text><text x="1680" y="354" text-anchor="middle" class="mutedText">planned</text>
  <rect x="1608" y="420" width="144" height="180" rx="10" class="muted" /><text x="1680" y="525" text-anchor="middle" class="mutedText">Guest network</text><text x="1680" y="555" text-anchor="middle" class="mutedText">planned</text>
  <rect x="1608" y="632" width="144" height="220" rx="10" class="muted" /><text x="1680" y="742" text-anchor="middle" class="mutedText">Wazuh / Zeek</text><text x="1680" y="772" text-anchor="middle" class="mutedText">evaluation</text><text x="1680" y="802" text-anchor="middle" class="mutedText">planned</text>

  <path class="blue" d="M390 235 H506" /><path class="blue" d="M390 410 H506" /><path class="blue" d="M390 584 H506" />
  <path class="blue" d="M762 305 H836" /><path class="blue" d="M836 352 H762" />
  <path class="blue" d="M1086 326 H1160" /><path class="blue" d="M1070 511 H1178" />
  <path class="blue" d="M1340 384 H1360" /><path class="blue" d="M1430 571 V586" />
  <path class="blue" d="M390 584 Q420 584 420 684 H846" /><text x="640" y="671" class="sub" fill="#0f63d8">DNS queries over private overlay</text>
  <path class="blue" d="M390 624 Q432 624 432 730 H1180" /><text x="640" y="722" class="sub" fill="#0f63d8">Encrypted exit-node transit</text>
  <path class="green" d="M762 620 H920 V560" /><path class="green" d="M980 646 V560" /><path class="green" d="M1056 672 H1160" />

  <rect x="20" y="832" width="410" height="122" rx="10" class="box" />
  <path class="blue" d="M44 870 H110" /><text x="124" y="876" class="legend">Blue arrow = private/runtime traffic</text>
  <path class="green" d="M44 914 H110" /><text x="124" y="910" class="legend">Green dashed arrow = operations /</text><text x="124" y="934" class="legend">security / monitoring</text>
</svg>
