  <rect x="28" y="810" width="400" height="130" rx="10" class="box" />
  <text x="54" y="844" class="legend">Legend</text>
  <path class="blue" d="M55 876 H125" />
  <text x="142" y="883" class="legend">Blue arrow = runtime traffic</text>
  <path class="green" d="M55 918 H125" />
  <text x="142" y="913" class="legend">Green dashed arrow = operations,</text>
  <text x="142" y="936" class="legend">monitoring, backup, CI/CD</text>
</svg>
