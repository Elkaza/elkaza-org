<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">The Vienna Fortress: Private Infrastructure and Operations Platform</title>
  <desc id="desc">Architecture diagram showing public admin access, public VPS edge, private Tailscale overlay, and the private Proxmox Debian Docker runtime used by the Vienna Fortress platform.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5.5 L1 10 Z" fill="#0f63d8" />
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5.5 L1 10 Z" fill="#15803d" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <linearGradient id="panel" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fbff" />
    </linearGradient>
    <style>
      .page{fill:#fff}.title{font:800 48px Arial,sans-serif;fill:#07143a}.zone{fill:url(#panel);stroke:#2463b8;stroke-width:2;stroke-dasharray:8 8}.zone-title{font:800 24px Arial,sans-serif;fill:#061b5b}.card{fill:#fff;stroke:#9aaac1;stroke-width:1.6;filter:url(#shadow)}.box{fill:#f8fbff;stroke:#9aaac1;stroke-width:1.4}.group{fill:#fff;stroke:#2463b8;stroke-width:1.7}.label{font:800 24px Arial,sans-serif;fill:#07143a}.sub{font:700 15px Arial,sans-serif;fill:#111827}.small{font:700 13px Arial,sans-serif;fill:#111827}.tiny{font:700 12px Arial,sans-serif;fill:#0f63d8}.blue{fill:none;stroke:#0f63d8;stroke-width:4;marker-end:url(#arrow-blue)}.green{fill:none;stroke:#15803d;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow-green)}.legend{font:700 16px Arial,sans-serif;fill:#07143a}.icon{font:800 34px Arial,sans-serif;fill:#0f63d8}
    </style>
  </defs>
  <rect class="page" width="1800" height="980" />
  <text x="900" y="54" text-anchor="middle" class="title">The Vienna Fortress: Private Infrastructure &amp; Operations Platform</text>

  <rect x="24" y="90" width="294" height="690" rx="16" class="zone" />
  <text x="54" y="136" class="zone-title">1. Public / Admin Access</text>
  <rect x="62" y="190" width="176" height="142" rx="10" class="card" />
  <text x="150" y="247" text-anchor="middle" class="icon">ADMIN</text>
  <text x="150" y="305" text-anchor="middle" class="label">Admin browser</text>
  <rect x="62" y="392" width="176" height="142" rx="10" class="card" />
  <text x="150" y="452" text-anchor="middle" class="icon">&gt;_</text>
  <text x="150" y="506" text-anchor="middle" class="label">SSH client</text>
  <rect x="62" y="595" width="176" height="142" rx="10" class="card" />
  <text x="150" y="655" text-anchor="middle" class="icon">WWW</text>
  <text x="150" y="707" text-anchor="middle" class="label">Public users</text>

  <rect x="360" y="90" width="322" height="690" rx="16" class="zone" />
  <text x="432" y="136" class="zone-title">2. Public VPS Edge</text>
  <rect x="392" y="196" width="260" height="490" rx="18" class="card" />
  <text x="522" y="238" text-anchor="middle" class="label">Public VPS Edge</text>
  <rect x="414" y="334" width="216" height="82" rx="8" class="box" />
  <text x="458" y="384" class="icon">N</text>
  <text x="514" y="366" class="sub">Nginx</text>
  <text x="514" y="389" class="sub">stream proxy</text>
  <rect x="414" y="438" width="216" height="82" rx="8" class="box" />
  <text x="456" y="489" class="icon">&gt;_</text>
  <text x="514" y="470" class="sub">SSH</text>
  <text x="514" y="493" class="sub">deployment target</text>
  <rect x="414" y="553" width="216" height="92" rx="8" class="box" />
  <text x="456" y="611" class="icon">WWW</text>
  <text x="514" y="589" class="sub">Public ingress:</text>
  <text x="514" y="614" class="sub">SSH, HTTP, HTTPS</text>
  <text x="522" y="724" text-anchor="middle" class="sub">Single public ingress point</text>

  <rect x="726" y="90" width="300" height="690" rx="16" class="zone" />
  <text x="754" y="136" class="zone-title">3. Private Tailscale Overlay</text>
  <rect x="760" y="275" width="210" height="374" rx="12" class="card" />
  <text x="865" y="370" text-anchor="middle" class="icon">LOCK</text>
  <text x="865" y="442" text-anchor="middle" class="label">Encrypted</text>
  <text x="865" y="476" text-anchor="middle" class="label">private transport</text>
  <rect x="775" y="515" width="180" height="72" rx="8" class="box" />
  <text x="822" y="550" text-anchor="middle" class="sub">No home-router</text>
  <text x="822" y="573" text-anchor="middle" class="sub">port exposure</text>
  <rect x="775" y="602" width="180" height="72" rx="8" class="box" />
  <text x="865" y="643" text-anchor="middle" class="sub">Private admin path</text>

  <rect x="1064" y="90" width="710" height="850" rx="16" class="zone" />
  <text x="1240" y="136" class="zone-title">4. Private Proxmox / Debian Runtime</text>
  <rect x="1120" y="160" width="610" height="62" rx="8" class="box" />
  <text x="1425" y="200" text-anchor="middle" class="label">Proxmox host</text>
  <rect x="1120" y="245" width="610" height="62" rx="8" class="box" />
  <text x="1425" y="285" text-anchor="middle" class="label">Debian VM</text>
  <rect x="1094" y="335" width="664" height="300" rx="18" class="group" />
  <text x="1426" y="369" text-anchor="middle" class="label">Docker Compose runtime</text>
  <rect x="1118" y="396" width="190" height="184" rx="8" class="box" />
  <text x="1213" y="420" text-anchor="middle" class="sub">Web &amp; Routing</text>
  <rect x="1136" y="442" width="154" height="48" rx="7" class="card" />
  <text x="1213" y="473" text-anchor="middle" class="small">Nginx Proxy Manager</text>
  <rect x="1136" y="512" width="154" height="48" rx="7" class="card" />
  <text x="1213" y="543" text-anchor="middle" class="small">elkaza-web</text>
  <rect x="1330" y="396" width="205" height="184" rx="8" class="box" />
  <text x="1433" y="420" text-anchor="middle" class="sub">Analytics</text>
  <rect x="1350" y="434" width="165" height="42" rx="7" class="card" /><text x="1433" y="462" text-anchor="middle" class="small">Plausible Analytics</text>
  <rect x="1350" y="489" width="165" height="42" rx="7" class="card" /><text x="1433" y="517" text-anchor="middle" class="small">PostgreSQL</text>
  <rect x="1350" y="544" width="165" height="42" rx="7" class="card" /><text x="1433" y="572" text-anchor="middle" class="small">ClickHouse</text>
  <rect x="1570" y="396" width="160" height="184" rx="8" class="box" />
  <text x="1650" y="420" text-anchor="middle" class="sub">Security</text>
  <rect x="1588" y="434" width="124" height="42" rx="7" class="card" /><text x="1650" y="462" text-anchor="middle" class="small">Pi-hole</text>
  <rect x="1588" y="489" width="124" height="42" rx="7" class="card" /><text x="1650" y="517" text-anchor="middle" class="small">CrowdSec</text>
  <rect x="1588" y="544" width="124" height="42" rx="7" class="card" /><text x="1650" y="572" text-anchor="middle" class="small">UFW</text>
  <rect x="1102" y="672" width="180" height="190" rx="10" class="box" />
  <text x="1192" y="702" text-anchor="middle" class="sub">Observability</text>
  <rect x="1120" y="720" width="144" height="38" rx="7" class="card" /><text x="1192" y="745" text-anchor="middle" class="small">Netdata</text>
  <rect x="1120" y="772" width="144" height="38" rx="7" class="card" /><text x="1192" y="797" text-anchor="middle" class="small">Uptime Kuma</text>
  <rect x="1120" y="824" width="144" height="38" rx="7" class="card" /><text x="1192" y="849" text-anchor="middle" class="small">Dozzle</text>
  <rect x="1322" y="672" width="208" height="190" rx="10" class="box" />
  <text x="1426" y="702" text-anchor="middle" class="sub">Operations (CI/CD)</text>
  <rect x="1342" y="720" width="168" height="38" rx="7" class="card" /><text x="1426" y="745" text-anchor="middle" class="small">Portainer</text>
  <rect x="1342" y="772" width="168" height="38" rx="7" class="card" /><text x="1426" y="797" text-anchor="middle" class="small">Watchtower</text>
  <rect x="1342" y="824" width="168" height="38" rx="7" class="card" /><text x="1426" y="849" text-anchor="middle" class="small">Homepage</text>
  <rect x="1585" y="708" width="142" height="130" rx="10" class="box" />
  <text x="1656" y="738" text-anchor="middle" class="sub">Backups</text>
  <rect x="1605" y="770" width="102" height="42" rx="7" class="card" /><text x="1656" y="798" text-anchor="middle" class="small">Backups</text>

  <path class="green" d="M238 265 H312 Q316 265 316 285 V374 H414" />
  <path class="green" d="M238 463 H316 Q320 463 320 482 H414" />
  <path class="blue" d="M238 666 H392" />
  <path class="blue" d="M630 599 H752" />
  <path class="green" d="M630 479 H752" />
  <path class="blue" d="M970 462 H1094" />
  <path class="green" d="M970 380 H1042 Q1045 380 1045 280 H1120" />
  <path class="blue" d="M1213 490 V512" />
  <path class="blue" d="M1290 466 H1350" />
  <path class="blue" d="M1433 476 V489" />
  <path class="blue" d="M1433 531 V544" />
  <path class="green" d="M1370 635 V660 H1192 V720" />
