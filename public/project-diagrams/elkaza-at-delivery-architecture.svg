<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Elkaza.at Infrastructure</title>
  <desc id="desc">Public-safe architecture diagram for Elkaza.at showing the runtime traffic path and the CI/CD deployment flow through a public VPS, private Tailscale overlay, and private Debian Docker runtime.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5.5 L1 10 Z" fill="#0f63d8" />
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L9 5.5 L1 10 Z" fill="#168426" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
    <linearGradient id="panel" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fbff" />
    </linearGradient>
    <style>
      .page { fill: #ffffff; }
      .title { font: 800 48px Arial, sans-serif; fill: #07143a; }
      .zone { fill: url(#panel); stroke-width: 2.2; stroke-dasharray: 6 6; }
      .zone-blue { stroke: #0f63d8; }
      .zone-green { stroke: #168426; }
      .zone-title { font: 800 23px Arial, sans-serif; fill: #0f63d8; }
      .zone-title-green { font: 800 23px Arial, sans-serif; fill: #168426; }
      .badge { fill: #0f63d8; }
      .badge-green { fill: #168426; }
      .badge-text { font: 800 22px Arial, sans-serif; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #9fb0c7; stroke-width: 1.6; filter: url(#shadow); }
      .card-flat { fill: #ffffff; stroke: #9fb0c7; stroke-width: 1.4; }
      .card-green { fill: #fbfffb; stroke: #168426; stroke-width: 1.6; }
      .inner { fill: #f9fbff; stroke: #7c8da8; stroke-width: 1.5; }
      .docker { fill: #fbfdff; stroke: #0f63d8; stroke-width: 1.7; }
      .heading { font: 800 21px Arial, sans-serif; fill: #111827; }
      .sub { font: 400 15px Arial, sans-serif; fill: #111827; }
      .small { font: 700 13px Arial, sans-serif; fill: #111827; }
      .tiny { font: 700 11px Arial, sans-serif; fill: #0f63d8; }
      .tiny-green { font: 800 12px Arial, sans-serif; fill: #168426; }
      .runtime { fill: none; stroke: #0f63d8; stroke-width: 4; marker-end: url(#arrow-blue); }
      .ops { fill: none; stroke: #168426; stroke-width: 2.6; stroke-dasharray: 6 6; marker-end: url(#arrow-green); }
      .legend { font: 500 14px Arial, sans-serif; fill: #111827; }
      .flow-heading { font: 800 20px Arial, sans-serif; fill: #168426; }
      .flow-text { font: 700 14px Arial, sans-serif; fill: #111827; }
      .caption-blue { font: 800 18px Arial, sans-serif; fill: #0f63d8; }
      .caption-green { font: 800 18px Arial, sans-serif; fill: #168426; }
    </style>
  </defs>

