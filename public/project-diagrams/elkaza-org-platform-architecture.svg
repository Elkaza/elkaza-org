<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Portfolio Platform Architecture</title>
  <desc id="desc">System, deployment, and content flow diagram for elkaza.org.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="dashArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .page { fill: #ffffff; }
      .band { fill: url(#surface); stroke: #60a5fa; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.5; filter: url(#shadow); }
      .card-green { fill: #f8fff9; stroke: #22c55e; stroke-width: 1.5; filter: url(#shadow); }
      .card-purple { fill: #fbf8ff; stroke: #a78bfa; stroke-width: 1.5; filter: url(#shadow); }
      .tiny-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .title { font: 700 22px Inter, Arial, sans-serif; fill: #0f172a; }
      .section-title { font: 800 20px Inter, Arial, sans-serif; fill: #1d4ed8; letter-spacing: .02em; }
      .label { font: 700 16px Inter, Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #334155; }
      .mini { font: 600 12px Inter, Arial, sans-serif; fill: #475569; }
      .blue { fill: #2563eb; }
      .green { fill: #16a34a; }
      .purple { fill: #7c3aed; }
      .flow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .flow-dashed { stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 9 7; fill: none; marker-end: url(#dashArrow); }
      .check { fill: none; stroke: #16a34a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="980" rx="18"/>

  <rect class="band" x="10" y="12" width="1580" height="340" rx="12"/>
  <circle cx="36" cy="38" r="13" class="blue"/>
  <text x="36" y="43" text-anchor="middle" font-family="Inter, Arial" font-size="15" font-weight="800" fill="#ffffff">1</text>
  <text x="62" y="45" class="section-title">SYSTEM OVERVIEW</text>

  <g transform="translate(52 70)">
    <rect class="card" width="190" height="230" rx="12"/>
    <circle cx="95" cy="44" r="20" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M66 88 Q95 58 124 88 L124 114 L66 114 Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="116" y="70" width="44" height="32" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="95" y="132" text-anchor="middle" class="label">Developer</text>
    <text x="95" y="154" text-anchor="middle" class="small">Content Author</text>
    <text x="22" y="184" class="small">- Write code and content</text>
    <text x="22" y="207" class="small">- Update projects and CV</text>
  </g>

  <g transform="translate(306 70)">
    <rect class="card" width="210" height="230" rx="12"/>
    <rect x="69" y="24" width="72" height="52" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M89 58 L77 48 L89 38 M121 38 L133 48 L121 58" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="105" y="100" text-anchor="middle" class="label">Local Development</text>
    <rect x="25" y="122" width="160" height="34" rx="6" class="tiny-card"/>
    <text x="44" y="144" class="mini">Next.js</text>
    <text x="96" y="144" class="mini">TypeScript</text>
    <text x="22" y="184" class="small">- App Router</text>
    <text x="22" y="207" class="small">- Tailwind CSS + i18n</text>
  </g>

  <g transform="translate(586 70)">
    <rect class="card-purple" width="340" height="230" rx="12"/>
    <circle cx="77" cy="51" r="30" fill="#111827"/>
    <text x="77" y="63" text-anchor="middle" font-family="Inter, Arial" font-size="31" font-weight="900" fill="#ffffff">GH</text>
    <text x="170" y="48" text-anchor="middle" class="label">GitHub Repository</text>
    <text x="170" y="72" text-anchor="middle" class="small">Source of truth</text>
    <text x="34" y="116" class="small">- Code and configuration</text>
    <text x="34" y="141" class="small">- Markdown content</text>
    <text x="34" y="166" class="small">- Reusable components</text>
    <rect x="182" y="98" width="128" height="100" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="246" y="121" text-anchor="middle" class="mini" fill="#5b21b6">Structured Content</text>
    <text x="198" y="150" class="mini">projects.ts</text>
    <text x="198" y="173" class="mini">messages.ts</text>
    <text x="198" y="196" class="mini">blog/*.md</text>
  </g>

  <g transform="translate(1010 70)">
    <rect class="card" width="210" height="230" rx="12"/>
    <circle cx="105" cy="48" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <path d="M94 48 h22 M105 37 v22" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="105" y="94" text-anchor="middle" class="label">GitHub Actions CI</text>
    <text x="24" y="132" class="small">- Install dependencies</text>
    <text x="24" y="156" class="small">- Build and lint</text>
    <text x="24" y="180" class="small">- Validate changes</text>
  </g>

  <g transform="translate(1286 70)">
    <rect class="card-green" width="210" height="230" rx="12"/>
    <path d="M105 28 L135 82 H75 Z" fill="#111827"/>
    <text x="105" y="108" text-anchor="middle" class="label">Vercel Platform</text>
    <text x="24" y="144" class="small">- Preview deployments</text>
    <text x="24" y="168" class="small">- Production release</text>
    <text x="24" y="192" class="small">- Global CDN + TLS</text>
  </g>

  <path class="flow" d="M242 185 H302"/>
  <path class="flow" d="M516 185 H582"/>
  <path class="flow" d="M926 185 H1004"/>
  <path class="flow" d="M1220 185 H1280"/>

  <rect class="band" x="10" y="365" width="1580" height="230" rx="12"/>
  <circle cx="36" cy="391" r="13" class="blue"/>
  <text x="36" y="396" text-anchor="middle" font-family="Inter, Arial" font-size="15" font-weight="800" fill="#ffffff">2</text>
  <text x="62" y="398" class="section-title">DEPLOYMENT / PUBLISHING WORKFLOW</text>

  <g transform="translate(58 424)">
    <rect class="card" width="145" height="125" rx="10"/>
    <text x="72" y="49" text-anchor="middle" class="label">Feature Branch</text>
    <text x="72" y="77" text-anchor="middle" class="small">Develop / update</text>
    <text x="72" y="98" text-anchor="middle" class="small">content and code</text>
  </g>
  <g transform="translate(276 424)">
    <rect class="card" width="145" height="125" rx="10"/>
    <text x="72" y="49" text-anchor="middle" class="label">Push to GitHub</text>
    <text x="72" y="80" text-anchor="middle" class="small">Create PR</text>
  </g>
  <g transform="translate(494 424)">
    <rect class="card" width="170" height="125" rx="10"/>
    <text x="85" y="41" text-anchor="middle" class="label">CI Validates</text>
    <text x="85" y="71" text-anchor="middle" class="small">Install, lint, build</text>
    <text x="85" y="94" text-anchor="middle" class="small">type check</text>
  </g>
  <g transform="translate(738 424)">
    <rect class="card-purple" width="190" height="125" rx="10"/>
    <text x="95" y="41" text-anchor="middle" class="label">Preview Deploy</text>
    <text x="95" y="71" text-anchor="middle" class="small">Per pull request</text>
    <text x="95" y="94" text-anchor="middle" class="small">Review before merge</text>
  </g>
  <g transform="translate(1002 424)">
    <rect class="card" width="150" height="125" rx="10"/>
    <text x="75" y="49" text-anchor="middle" class="label">Merge to Main</text>
    <text x="75" y="80" text-anchor="middle" class="small">Code and content</text>
  </g>
  <g transform="translate(1228 424)">
    <rect class="card-green" width="230" height="125" rx="10"/>
    <text x="115" y="41" text-anchor="middle" class="label">Production Deployment</text>
    <text x="115" y="71" text-anchor="middle" class="small">elkaza.org via Vercel</text>
    <text x="115" y="94" text-anchor="middle" class="small">CDN, HTTPS, rollback</text>
  </g>
  <path class="flow" d="M203 486 H270"/>
  <path class="flow" d="M421 486 H488"/>
  <path class="flow" d="M664 486 H732"/>
  <path class="flow" d="M928 486 H996"/>
  <path class="flow" d="M1152 486 H1222"/>

  <rect class="band" x="10" y="608" width="1580" height="250" rx="12"/>
  <circle cx="36" cy="634" r="13" class="blue"/>
  <text x="36" y="639" text-anchor="middle" font-family="Inter, Arial" font-size="15" font-weight="800" fill="#ffffff">3</text>
  <text x="62" y="641" class="section-title">CONTENT &amp; DATA FLOW</text>

  <g transform="translate(58 674)">
    <rect class="card" width="300" height="128" rx="10"/>
    <text x="24" y="36" class="label">Structured Content</text>
    <text x="24" y="66" class="small">projects.ts, messages.ts, components</text>
    <text x="24" y="91" class="small">blog/*.md and reusable UI sections</text>
  </g>
  <g transform="translate(444 674)">
    <rect class="card" width="280" height="128" rx="10"/>
    <text x="140" y="36" text-anchor="middle" class="label">Next.js App</text>
    <text x="140" y="66" text-anchor="middle" class="small">Build, render and route content</text>
    <text x="140" y="91" text-anchor="middle" class="small">SEO + accessibility aware</text>
  </g>
  <g transform="translate(820 674)">
    <rect class="card-green" width="300" height="128" rx="10"/>
    <text x="150" y="34" text-anchor="middle" class="label">Public Website</text>
    <text x="150" y="58" text-anchor="middle" class="small">elkaza.org</text>
    <g transform="translate(54 82)">
      <path class="check" d="M0 8 L7 15 L20 0"/>
      <text x="32" y="12" class="small">Home</text>
      <path class="check" d="M100 8 L107 15 L120 0"/>
      <text x="132" y="12" class="small">Projects</text>
    </g>
  </g>
  <g transform="translate(1220 674)">
    <rect class="card" width="260" height="128" rx="10"/>
    <text x="130" y="36" text-anchor="middle" class="label">Visitor Browser</text>
    <text x="130" y="66" text-anchor="middle" class="small">Fast, accessible, multilingual</text>
    <text x="130" y="91" text-anchor="middle" class="small">Optimized public presentation</text>
  </g>
  <path class="flow" d="M358 738 H438"/>
  <path class="flow" d="M724 738 H814"/>
  <path class="flow" d="M1120 738 H1214"/>

  <g transform="translate(1072 808)">
    <rect class="card-purple" width="330" height="72" rx="10"/>
    <text x="165" y="28" text-anchor="middle" class="mini" fill="#5b21b6">Optional Privacy-First Analytics</text>
    <text x="44" y="54" class="small">Plausible Analytics - no personal data</text>
  </g>
  <path class="flow-dashed" d="M970 802 C970 870 1030 846 1066 846"/>

  <g transform="translate(56 890)">
    <rect class="tiny-card" width="890" height="70" rx="10"/>
    <text x="25" y="42" class="section-title">LEGEND</text>
    <path class="flow" d="M140 36 H220"/>
    <text x="240" y="31" class="small">Code / content / build flow</text>
    <path class="flow-dashed" d="M470 36 H550"/>
    <text x="570" y="31" class="small">Optional analytics flow</text>
  </g>
  <g transform="translate(1000 890)">
    <rect class="tiny-card" width="540" height="70" rx="10"/>
    <text x="270" y="22" text-anchor="middle" class="mini" fill="#1d4ed8">TECHNOLOGY STACK</text>
    <text x="60" y="49" text-anchor="middle" class="small">Next.js</text>
    <text x="165" y="49" text-anchor="middle" class="small">TypeScript</text>
    <text x="285" y="49" text-anchor="middle" class="small">Tailwind CSS</text>
    <text x="405" y="49" text-anchor="middle" class="small">Vercel</text>
    <text x="500" y="49" text-anchor="middle" class="small">GitHub</text>
  </g>
</svg>
