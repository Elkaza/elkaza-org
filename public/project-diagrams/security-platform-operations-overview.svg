  <rect x="678" y="696" width="220" height="64" rx="8" class="card" /><text x="788" y="735" text-anchor="middle" class="sub">Uptime Kuma</text>
  <rect x="954" y="696" width="195" height="64" rx="8" class="card" /><text x="1052" y="735" text-anchor="middle" class="sub">Dozzle</text>
  <rect x="1228" y="696" width="225" height="64" rx="8" class="card" /><text x="1340" y="724" text-anchor="middle" class="sub">Service health</text><text x="1340" y="748" text-anchor="middle" class="sub">and logs</text>

  <rect x="408" y="818" width="195" height="58" rx="8" class="card" /><text x="505" y="854" text-anchor="middle" class="sub">Portainer</text>
  <rect x="678" y="818" width="220" height="58" rx="8" class="card" /><text x="788" y="854" text-anchor="middle" class="sub">Watchtower</text>
  <rect x="954" y="818" width="195" height="58" rx="8" class="card" /><text x="1052" y="854" text-anchor="middle" class="sub">Backups</text>
  <rect x="1228" y="818" width="225" height="58" rx="8" class="card" /><text x="1340" y="854" text-anchor="middle" class="sub">Docker Compose</text>
  <path class="green" d="M503 552 V696" /><path class="green" d="M735 552 V696" /><path class="green" d="M985 552 V696" /><path class="green" d="M1335 622 V696" />
  <path class="green" d="M505 760 V818" /><path class="green" d="M788 760 V818" /><path class="green" d="M1052 760 V818" /><path class="green" d="M1340 760 V818" />
  <path class="green" d="M1149 847 H1228" /><path class="green" d="M1453 847 H1518 V620 H1450" />

  <rect x="205" y="932" width="1380" height="44" rx="9" fill="#f8fbff" stroke="#0f63d8" stroke-width="1.7" />
  <text x="895" y="962" text-anchor="middle" class="outcome">Private access paths, controlled exposure, first-party analytics, and clear service visibility.</text>
  <rect x="1468" y="898" width="300" height="76" rx="8" class="card" />
  <path class="blue" d="M1492 922 H1552" /><text x="1568" y="928" class="legend">Blue arrow = runtime traffic</text>
  <path class="green" d="M1492 956 H1552" /><text x="1568" y="950" class="legend">Green dashed arrow =</text><text x="1568" y="968" class="legend">operations, security, monitoring</text>
</svg>
