  <rect x="792" y="304" width="240" height="72" rx="8" class="card" /><text x="912" y="333" text-anchor="middle" class="sub">CrowdSec</text><text x="912" y="357" text-anchor="middle" class="small">intrusion response</text>
  <rect x="1100" y="304" width="236" height="72" rx="8" class="card" /><text x="1218" y="333" text-anchor="middle" class="sub">Reduced</text><text x="1218" y="357" text-anchor="middle" class="small">public exposure</text>
