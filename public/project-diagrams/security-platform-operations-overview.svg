<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Security and Platform Operations</title>
  <desc id="desc">Layered security overview showing access and network controls, filtering and defense, web analytics, observability, operations, and the public and private trust boundaries.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5.5 L1 10 Z" fill="#0f63d8" /></marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5.5 L1 10 Z" fill="#15803d" /></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" /></filter>
    <style>
      .page{fill:#fff}.title{font:800 52px Arial,sans-serif;fill:#07143a}.row{fill:#fff;stroke:#b8c6d8;stroke-width:1.5}.rowGreen{fill:#fbfff9;stroke:#b6d7b6;stroke-width:1.5}.trust{fill:none;stroke:#60a5fa;stroke-width:2;stroke-dasharray:8 8}.trustGreen{fill:none;stroke:#86c98d;stroke-width:2;stroke-dasharray:8 8}.label{font:800 25px Arial,sans-serif;fill:#07143a}.card{fill:#fff;stroke:#a7b3c4;stroke-width:1.5;filter:url(#shadow)}.sub{font:800 19px Arial,sans-serif;fill:#07143a}.small{font:700 14px Arial,sans-serif;fill:#111827}.blue{fill:none;stroke:#0f63d8;stroke-width:4;marker-end:url(#arrow-blue)}.green{fill:none;stroke:#15803d;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#arrow-green)}.legend{font:700 15px Arial,sans-serif;fill:#07143a}.boundary{font:800 24px Arial,sans-serif}.outcome{font:800 24px Arial,sans-serif;fill:#07143a}
    </style>
  </defs>
  <rect class="page" width="1800" height="980" />
  <text x="900" y="58" text-anchor="middle" class="title">Security &amp; Platform Operations</text>
  <rect x="20" y="84" width="360" height="158" rx="8" class="row" /><text x="104" y="170" class="label">1. Access &amp; Network</text>
  <rect x="20" y="260" width="360" height="148" rx="8" class="rowGreen" /><text x="104" y="340" class="label">2. Filtering &amp; Defense</text>
  <rect x="20" y="424" width="360" height="226" rx="8" class="row" /><text x="104" y="515" class="label">3. Web &amp; Analytics</text>
  <rect x="20" y="668" width="360" height="112" rx="8" class="rowGreen" /><text x="104" y="735" class="label">4. Observability</text>
  <rect x="20" y="794" width="360" height="104" rx="8" class="rowGreen" /><text x="104" y="858" class="label">5. Operations</text>

  <rect x="380" y="84" width="1110" height="158" rx="8" class="trust" /><text x="1560" y="170" text-anchor="middle" class="boundary" fill="#0f63d8">Public web surface</text>
  <rect x="380" y="260" width="1110" height="148" rx="8" class="trustGreen" /><text x="1560" y="332" text-anchor="middle" class="boundary" fill="#15803d">Private</text><text x="1560" y="363" text-anchor="middle" class="boundary" fill="#15803d">management plane</text>
  <rect x="380" y="424" width="1330" height="226" rx="8" class="trust" /><text x="1600" y="532" text-anchor="middle" class="boundary" fill="#0f63d8">Private</text><text x="1600" y="563" text-anchor="middle" class="boundary" fill="#0f63d8">data plane</text>

  <rect x="408" y="132" width="205" height="76" rx="8" class="card" /><text x="510" y="178" text-anchor="middle" class="sub">Tailscale</text>
  <rect x="682" y="132" width="205" height="76" rx="8" class="card" /><text x="785" y="178" text-anchor="middle" class="sub">SSH aliases</text>
  <rect x="955" y="132" width="205" height="76" rx="8" class="card" /><text x="1058" y="178" text-anchor="middle" class="sub">UFW</text>
  <rect x="1230" y="132" width="230" height="76" rx="8" class="card" /><text x="1345" y="165" text-anchor="middle" class="sub">Nginx Proxy</text><text x="1345" y="190" text-anchor="middle" class="sub">Manager</text>
